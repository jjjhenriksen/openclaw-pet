name: Platform validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pet-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: windows-2025
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: openclaw-pet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: openclaw-pet/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.12.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: runner.os == 'Windows'
        with:
          global-json-file: openclaw-pet/global.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build, test, and verify platform archive
        run: npm run validate
      - name: Verify dependency locks were unchanged
        run: git diff --exit-code -- package-lock.json overlay/windows/packages.lock.json
      - name: Save validated package (not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openclaw-pet-${{ matrix.platform }}-${{ github.sha }}
          path: openclaw-pet/*.tgz
          if-no-files-found: error
          retention-days: 14
